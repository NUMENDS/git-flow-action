name: Gitflow CI

on: 
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Run Git Flow
    steps:
      - uses: actions/checkout@v2
      - name: Run git flow process
        uses: ./
        id: git-flow
        with:
          github_token: ${{ secrets.ADMIN_TOKEN }}
          master_branch: 'main'
          development_branch: 'development'